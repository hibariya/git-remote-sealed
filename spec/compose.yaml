# Formal-model toolchain in a container (no host npm/JVM, per standing policy).
#
#   podman compose run --rm check      # typecheck + negative controls + verify
#   podman compose run --rm shell      # poke at the model by hand
services:
  shell: &quint
    build:
      context: ..
      dockerfile: spec/Dockerfile
    working_dir: /repo/spec
    volumes:
      - ..:/repo:z
    environment:
      # Apalache runs out of the default JVM heap on the deep configs and
      # dies as an opaque exit-137; give it room and fail with a Java OOM
      # message instead if it ever exceeds this.
      JVM_ARGS: -Xmx4g
    command: bash

  check:
    <<: *quint
    command: /repo/spec/check.sh

  check-fast:
    <<: *quint
    command: /repo/spec/check-fast.sh
