[package]
name = "git-remote-sealed"
version = "0.3.2"
edition = "2021"
description = "An end-to-end encrypted git remote: back up a repository to a host that can read nothing"
license = "MIT"
repository = "https://github.com/hibariya/git-remote-sealed"

[lib]
name = "sealed"
path = "src/lib.rs"

[[bin]]
name = "git-remote-sealed"
path = "src/main.rs"

# Deliberately minimal (see README.md): age for encryption (embedded, no age
# binary), sha2 for digests, std for everything else; git is invoked as a
# subprocess, never linked.
[dependencies]
age = "=0.11.5"
sha2 = "=0.10.9"

# Tests only, never in the binary: tests/mbt_pins.rs replays traces of
# spec/protocol.qnt against the pin layer. quint-connect's `switch!` expands
# to `serde::` and `anyhow::` paths, so the test crate names both.
[dev-dependencies]
anyhow = "1"
quint-connect = "0.1.2"
serde = { version = "1", features = ["derive"] }
