name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `git` is how the helper reads and writes repositories at all, and
      # `age` is what tests/claims_e2e.rs runs FORMAT.md's Appendix A with —
      # the recovery claim is only worth something if the STOCK binary
      # proves it, not our embedded copy of the age crate.
      - name: Install git and age
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git age

      # Deliberately stable, not a pinned version. A pinned toolchain hides
      # new lints: this crate shipped a clippy failure for weeks because the
      # container pinned 1.94 and the lint arrived in 1.97. The cost is that
      # a new Rust release can turn CI red without a code change; that is
      # the direction worth failing in.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # tests/mbt_pins.rs replays traces of spec/protocol.qnt against the pin
  # layer with quint-connect, so it needs Rust AND quint. It is #[ignore]d in
  # the plain `cargo test` above (no quint there) rather than skipped at
  # runtime: a test that silently passes without quint would look green while
  # checking nothing. This job is where it runs.
  mbt:
    name: Pin layer vs the model (quint-connect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @informalsystems/quint

      # `quint run` and `quint test` use the Rust evaluator, fetched on first
      # use into ~/.quint. Its own cache key: the model job's cache also holds
      # the Apalache distribution, and a shared key would let this job save an
      # Apalache-less copy that the model job then restores and cannot update.
      - name: Cache the Quint evaluator
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-evaluator-${{ runner.os }}-${{ hashFiles('spec/warm.qnt') }}-v1
      - name: Warm the evaluator
        run: quint test spec/warm.qnt

      - run: cargo test --locked --test mbt_pins -- --ignored

  model:
    name: Formal model (fast lane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm install -g @informalsystems/quint

      # `quint verify` downloads the Apalache distribution on first use and
      # `quint test` fetches the Rust evaluator. Cache both so the usual run
      # needs no network, and warm them explicitly: a silent download
      # failure would otherwise surface later as a confusing model error.
      # Verified: quint puts both downloads under ~/.quint —
      # apalache-dist-<ver>/ and rust-evaluator-v<ver>/. The key carries the
      # quint version, since a quint upgrade wants different ones.
      - name: Cache Apalache and the Quint evaluator
        uses: actions/cache@v4
        with:
          path: ~/.quint
          key: quint-${{ runner.os }}-${{ hashFiles('spec/warm.qnt') }}-v1
      - name: Warm the engines
        run: |
          quint verify --max-steps=1 --invariant=inv spec/warm.qnt
          quint test spec/warm.qnt

      # The same script the container and a developer run — inlining the
      # commands here is how CI and local checking drift apart. ~15s of
      # compute; what it buys is the scenario tests and the two negative
      # controls, which must still FIND their attacks.
      - name: Fast lane
        run: ./spec/spec.sh
