name: Absence proofs (deep)

# The symbolic proofs, NOT on every push: they take hours and can wedge.
# See spec/README.md, "Why these bounds", for the measured cost and the
# depth currently claimed. Run this after changing the model or FORMAT.md's
# protocol core, and update that README with what it reports.
on:
  workflow_dispatch:
    inputs:
      max_steps:
        description: 'Proof depth (4 is ~40 min; 5 has run for hours)'
        default: '4'

jobs:
  proof:
    name: Apalache absence proofs
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install -g @informalsystems/quint
      # spec.sh runs the fast lane first, so a proof never runs against a
      # model whose scenario tests or negative controls are already broken.
      - name: Prove
        run: ./spec/spec.sh --full --depth ${{ inputs.max_steps }}
